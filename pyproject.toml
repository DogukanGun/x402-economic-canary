[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casper-pay-guard"
version = "0.1.0"
description = "Economic canary for pay-then-deliver x402 agent markets: detects settled-but-stalled ASPs before you route"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dogukan Ali Gundogan" }]

dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "httpx>=0.28",
    "eth-account>=0.13.7",
    "mcp>=1.27",
    "pydantic>=2.11",
    "prometheus-client>=0.20",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
casper-canary = "casper_pay_guard.cli:main"
casper-mcp = "casper_pay_guard.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
